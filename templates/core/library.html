{% extends 'core/base.html' %}

{% block title %}Library — MangaVault{% endblock %}

{% block extra_css %}
<style>
.library-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
.library-header h1 { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: .5rem; }
.library-header h1 i { width: 22px; height: 22px; color: var(--accent); }
.library-stats { display: flex; gap: 1.5rem; }
.stat { text-align: center; }
.stat .num { font-size: 1.5rem; font-weight: 800; color: var(--accent); }
.stat .label { font-size: .72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
.filter-bar { display: flex; gap: .5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.filter-bar .input { flex: 1; min-width: 200px; }
</style>
{% endblock %}

{% block content %}
<div class="library-header">
    <h1><i data-lucide="library"></i> My Library</h1>
    <div class="library-stats">
        <div class="stat"><div class="num" id="total-count">&mdash;</div><div class="label">Manga</div></div>
        <div class="stat"><div class="num" id="downloaded-count">&mdash;</div><div class="label">Downloaded</div></div>
    </div>
</div>

<div class="filter-bar">
    <input type="text" class="input" id="filterInput" placeholder="Filter library...">
</div>

<div id="library-grid" class="grid"></div>
<div id="empty-state" class="empty-state" style="display:none">
    <div class="icon-wrap"><i data-lucide="book-marked"></i></div>
    <p>Your library is empty. <a href="/search/">Search for manga</a> to get started.</p>
</div>

<script>
var allManga = [];

function renderLibrary(items) {
    var grid = document.getElementById('library-grid');
    grid.innerHTML = '';
    if (!items.length) {
        document.getElementById('empty-state').style.display = 'block';
        return;
    }
    document.getElementById('empty-state').style.display = 'none';
    items.forEach(function(m) {
        var card = document.createElement('a');
        card.href = '/manga/' + m.id + '/';
        card.className = 'card';
        card.innerHTML =
            '<img src="' + m.cover + '" alt="' + m.title + '" loading="lazy" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 300%22><rect fill=%22%231c2333%22 width=%22200%22 height=%22300%22/><text x=%2250%%25%22 y=%2250%%25%22 fill=%22%236e7681%22 text-anchor=%22middle%22 font-size=%2216%22>No Cover</text></svg>\'">' +
            '<div class="card-body"><h3>' + m.title + '</h3>' +
            '<div class="meta">' + m.downloaded + '/' + m.chapters + ' chapters</div>' +
            '<div style="margin-top:.4rem;display:flex;gap:.3rem;flex-wrap:wrap">' +
            '<span class="badge badge-accent">' + (m.content_type || 'manga').toUpperCase() + '</span>' +
            '<span class="badge badge-muted">' + (m.source || '').toUpperCase() + '</span>' +
            '</div></div>';
        grid.appendChild(card);
    });
}

fetch('/api/library/')
    .then(function(r) { return r.json(); })
    .then(function(data) {
        allManga = data.manga;
        document.getElementById('total-count').textContent = allManga.length;
        document.getElementById('downloaded-count').textContent = allManga.filter(function(m) { return m.downloaded > 0; }).length;
        renderLibrary(allManga);
    })
    .catch(function() { showToast('Failed to load library', 'error'); });

document.getElementById('filterInput').addEventListener('input', function(e) {
    var q = e.target.value.toLowerCase();
    renderLibrary(allManga.filter(function(m) { return m.title.toLowerCase().indexOf(q) !== -1; }));
});
</script>
{% endblock %}
